<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página com CSS Inline</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%;">
        
        <h1 style="color: #de3636; margin-bottom: 10px; font-size: 24px;">Olá, Leandro!</h1>
        
        <p style="color: #1a0404; line-height: 1.6; margin-bottom: 25px;">
            Este é um exemplo de interface limpa utilizando apenas estilos aplicados diretamente nas tags. Ideal para testes rápidos de interface.
        </p>

        <button style="background-color: #e46f1b; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s;" 
                onmouseover="this.style.backgroundColor='#005a9e'" 
                onmouseout="this.style.backgroundColor='#0078d4'">
            Clique Aqui
        </button>

    </div>

</body>
</html>
